<div class="flex flex-col gap-3">
  <div>
    <h2 class="w-full text-2xl font-semibold mb-1" style="color: var(--text)">Buttons</h2>
    <div class="flex gap-2">
      <app-my-button label="Primary" (clicked)="onClick($event)"></app-my-button>
      <app-my-button label="Secondary" variant="secondary" [disabled]="true"></app-my-button>
      <app-my-button label="Success" variant="success"></app-my-button>
      <app-my-button label="Danger" variant="danger"></app-my-button>
    </div>
  </div>
  
  <div>
    <h2 class="mb-1" style="color: var(--text)">Table</h2>
    <div>
      <app-my-table
        [columns]="tableColumns"
        [data]="testData"
        (actionClicked)="onTableActionClicked($event)"
        (paginationClicked)="onPaginationClicked($event)"
      >
    </app-my-table>
    </div>
  </div>

  <app-my-searchbar
    (keywordChange)="onSearchBarChanged($event)"
  ></app-my-searchbar>
  
  <app-my-form
    [myFormGroup]="formGroup"
    [myFields]="formFields"
    submitLabel="Submit"
    (submitted)="onFormSubmit($event)"
  ></app-my-form>
</div>
