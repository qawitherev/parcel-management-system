name: CI

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Backend — build + test
  # ============================================================
  backend-build:
    name: Backend — Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --configuration Release --no-restore --warnaserror
        working-directory: backend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/src/ParcelManagement.Api/bin/Release/net9.0
            backend/src/ParcelManagement.Core/bin/Release/net9.0
            backend/src/ParcelManagement.Infrastructure/bin/Release/net9.0
            backend/src/ParcelManagement.Test/bin/Release/net9.0

  backend-unit-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: backend-build
          path: .

      - name: Run unit tests
        run: dotnet test --configuration Release --logger "trx;LogFileName=unit-test-report.trx"
        working-directory: backend/src/ParcelManagement.Test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: backend/**/*.trx

  backend-integration-test:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-build, backend-unit-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: backend-build
          path: .

      - name: Run integration tests
        run: dotnet test --configuration Release --logger "trx;LogFileName=integration-test-report.trx"
        working-directory: backend/src/ParcelManagement.Test.Integration

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: backend/**/*.trx

  # ============================================================
  # Frontend — build verification (no deploy)
  # ============================================================
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --configuration=production
        working-directory: frontend
