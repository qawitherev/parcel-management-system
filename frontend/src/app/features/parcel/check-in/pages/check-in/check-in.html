<div class="pl">Operations</div>
<h1>Check In Parcel</h1>
<p class="sub">Register a new parcel into the system.</p>

@if (isBulkCheckInPopup) {
  <app-file-upload
    [mapper]="payloadMapper"
    (cancelEmitter)="onBulkCheckInPopup()"
    (dataEmitter)="onUploadFinished($event)"
  ></app-file-upload>
} @else {
  <div class="form-card">
    <form [formGroup]="formGroup" (ngSubmit)="onCheckIn(formGroup.value)">
      <div class="fg">
        <label>Tracking Number</label>
        <input formControlName="trackingNumber" type="text" placeholder="e.g. TRK001" />
      </div>
      <div class="fg">
        <label>Weight (kg)</label>
        <input formControlName="weight" type="text" placeholder="0.5" />
      </div>
      <div class="fg">
        <label>Dimensions</label>
        <input formControlName="dimensions" type="text" placeholder="e.g. 30x20x10 cm" />
      </div>
      <div class="fg">
        <label>Locker</label>
        <input formControlName="locker" type="text" placeholder="e.g. A-12" />
      </div>
      <div class="fg">
        <label>Resident Unit</label>
        <input formControlName="residentUnit" type="text" placeholder="e.g. RU001" />
      </div>

      @let res = checkInResponse$ | async;
      @if (res && res.error) {
        <div class="err-card"><strong>Check-in failed</strong><br>{{ res.message }}</div>
      }

      <div class="btn-row">
        <button type="submit" class="btn" [disabled]="isCheckingIn">
          {{ isCheckingIn ? 'Checking in...' : 'Check In Parcel' }}
        </button>
        <button type="button" class="btn btn-o" (click)="onBulkCheckInPopup()">Bulk Check In</button>
      </div>
    </form>
  </div>
}
