<div class="pl">Parcels</div>
<h1>Claim Parcel</h1>
<p class="sub">Enter a tracking number to claim a parcel.</p>

@if (isBulkClaimPopup) {
  <app-file-upload
    [mapper]="payloadMapper"
    (cancelEmitter)="onBulkClaimPopup()"
    (dataEmitter)="onBulkClaim($event)"
  ></app-file-upload>
} @else {
  <div class="form-card">
    <form [formGroup]="formGroup" (ngSubmit)="onClaim(formGroup.value)">
      <div class="fg">
        <label>Tracking Number</label>
        <input formControlName="trackingNumber" type="text" placeholder="e.g. TRK001" />
      </div>

      @let res = claimResponse$ | async;
      @if (res && res.error) {
        <div class="err-card"><strong>Claim failed</strong><br>{{ res.message }}</div>
      }
      @if (res && !res.error) {
        <div class="success-card">{{ res.message }}</div>
      }

      <div class="btn-row">
        <button type="submit" class="btn" [disabled]="isClaiming">
          {{ isClaiming ? 'Claiming...' : 'Claim Parcel' }}
        </button>
        <button type="button" class="btn btn-o" (click)="onBulkClaimPopup()">Bulk Claim</button>
      </div>
    </form>
  </div>
}
