<div class="pl">Parcels</div>
<h1>Tracking</h1>
<p class="sub">Search for a parcel by tracking number.</p>

<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <div class="search-bar">
    <input
      formControlName="searchKeyword"
      type="text"
      placeholder="Enter tracking number"
    />
    <button type="submit" [disabled]="formGroup.invalid">Search</button>
  </div>
</form>
