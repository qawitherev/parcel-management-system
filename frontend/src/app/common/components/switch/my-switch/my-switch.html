<label class="my-switch-label">
  @if (willShowLabel) {
  <span class="my-switch-label-text">{{ isPositive ? labelOn : labelOff }}</span>
  }
  <input
    [checked]="isPositive"
    type="checkbox"
    class="hidden"
    (change)="onSwitchToggled($event)"
  />
  <span class="my-switch-track" [class.switch-on]="isPositive" [class.switch-off]="!isPositive">
    <span class="my-switch-thumb" [class.thumb-on]="isPositive" [class.thumb-off]="!isPositive"></span>
  </span>
</label>
