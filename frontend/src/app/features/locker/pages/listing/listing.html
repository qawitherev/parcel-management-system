<div class="pl">Management</div>
<h1>Lockers</h1>
<p class="sub">Manage parcel room lockers.</p>

<div class="search-bar">
  <input type="text" placeholder="Search lockers..." (input)="onSearch($any($event.target).value)" />
  <button>Search</button>
</div>
<div class="btn-row" style="margin-bottom: 16px;">
  <button class="btn" (click)="onAddLockerClick()">Add Locker</button>
</div>

@let lockers = lockerList$ | async;
@if (lockers && ('error' in lockers) && $any(lockers).error) {
  <app-error-card [title]="$any(lockers).message || 'Failed to load lockers'"></app-error-card>
} @else if (lockers && ('lockers' in lockers)) {
  <app-my-table
    [columns]="tableColumns"
    [data]="$any(lockers).lockers"
    [count]="$any(lockers).count"
    (actionClicked)="onActionClicked($event)"
    (paginationClicked)="onPaginationChanged($event)"
  ></app-my-table>
}
