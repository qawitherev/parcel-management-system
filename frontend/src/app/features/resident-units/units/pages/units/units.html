<div class="pl">Management</div>
<h1>Resident Units</h1>
<p class="sub">Manage residential units in the building.</p>

<div class="search-bar">
  <input type="text" placeholder="Search units..." (input)="onSearch($any($event.target).value)" />
  <button>Search</button>
</div>
<div class="btn-row" style="margin-bottom: 16px;">
  <button class="btn" (click)="onAddClick()">Add Unit</button>
</div>

@let units = unitList$ | async;
@if (units && ('error' in units) && $any(units).error) {
  <app-error-card [title]="$any(units).message || 'Failed to load units'"></app-error-card>
} @else if (units && ('residentUnits' in units)) {
  <app-my-table
    [columns]="tableColumns"
    [data]="$any(units).residentUnits"
    [count]="$any(units).count"
    (actionClicked)="onActionClicked($event)"
    (paginationClicked)="onPaginationChanged($event)"
  ></app-my-table>
}
